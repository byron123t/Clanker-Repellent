[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clanker-repellent"
version = "0.1.0"
description = "Clanker Repellent: a controlled tool for artifact-induced LLM over-refusal research"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["openai>=1.50,<2", "prompt-toolkit>=3.0,<4"]

[project.optional-dependencies]
dev = ["coverage[toml]>=7.6,<8", "pytest>=8"]

[tool.coverage.run]
branch = true
source = ["llmddos.payload_scatter"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[project.scripts]
repel = "llmddos.repo_tool:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
