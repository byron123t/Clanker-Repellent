[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clanker-repellent"
version = "0.1.0"
description = "Repel: tracked software annotations, exact restoration, and controlled repository evaluation"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["openai>=1.50,<2", "prompt-toolkit>=3.0,<4"]

[project.optional-dependencies]
dev = ["coverage[toml]>=7.6,<8", "pytest>=8"]

[tool.coverage.run]
branch = true
source = ["clanker_repellent.payload.payload_scatter"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[project.scripts]
repel = "clanker_repellent.cli.repo_tool:main"

[tool.setuptools]
package-dir = {"" = "src", "repel_dashboard_ui" = "dashboard/repel_dashboard_ui"}

[tool.setuptools.packages.find]
where = ["src", "dashboard"]
include = ["clanker_repellent*", "repel_dashboard_ui"]

[tool.setuptools.package-data]
"repel_dashboard_ui" = ["*.html", "*.css", "*.js", "*.svg"]
